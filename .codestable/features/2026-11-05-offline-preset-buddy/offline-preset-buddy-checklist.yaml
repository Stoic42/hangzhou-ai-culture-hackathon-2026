feature: 2026-11-05-offline-preset-buddy
created: 2026-11-05

steps:
  - action: 真机编排骨架：准备TuyaOpen工具链并验证显示、触摸、音频、烧录与日志
    exit_signal: 通过实际烧录口完成烧录且实际日志口有启动日志，真机触摸和测试音均可用
    status: pending
  - action: 共享契约：实现规则包v1校验器与三只玩法不同的内置预设
    exit_signal: 合法预设通过且未知op或枚举、缺失节点、无双结局、非法时长负例均失败
    status: pending
  - action: 运行时骨架：实现主界面、详情、生成页离线状态并加载内置规则包创建GameSession
    exit_signal: 三只预设均能从主界面进入初始节点，长按看详情，生成页可返回且详情返回保留选中项
    status: pending
  - action: 游戏状态机：实现触摸迁移、变量、倒计时、双结局与重开
    exit_signal: 三只预设均可到达两种结局且重开后变量和倒计时复位
    status: pending
  - action: 参数化表演：接入节点文本、形象、动作和本地音频反馈
    exit_signal: 三只预设的外观、文本与反馈在真机可区分
    status: pending
  - action: 真机收口：执行双结局脚本、断网连续重开、非法包和范围回归
    exit_signal: 每只双结局各1次且另做不少于3局连续重开，构建与校验命令重跑通过
    status: pending

checks:
  - item: 规则包v1使用白名单事件、动作、完整枚举与60—90秒时长
    source: 名词契约
    status: pending
  - item: 内置资源使用builtin URI、SHA-256和固件资源表完成离线校验
    source: 名词契约
    status: pending
  - item: 选择、校验、开局、事件、结局、重开形成完整状态机
    source: 编排骨架
    status: pending
  - item: 非法包不开局，计时优先于同循环新触摸，结局后忽略手势，重开创建新Session
    source: 流程级约束
    status: pending
  - item: 主界面滑动/点按/长按、详情返回、固定游戏返回和生成页离线状态符合导航契约
    source: 流程级约束
    status: pending
  - item: 详情页只显示搭子内容、主题标签和本地状态，不显示创造者原话或具体逻辑
    source: 流程级约束
    status: pending
  - item: T5入口、预设注册表、白名单和构建配置可独立核对
    source: 挂载点
    status: pending
  - item: 不包含麦克风创建、服务器、联机、动态代码、长期存档或归档改动
    source: 范围守护
    status: pending
  - item: 三只预设覆盖双结局、各3局连续重开、断网与真机反馈
    source: 验收场景
    status: pending

dod:
  commands:
    - id: CMD-001
      command: py -3.12 shared/tools/validate_buddies.py shared/presets
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: cd device/t5 && tos.py build
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: cd device/t5 && tos.py flash
      core: true
      failure_handling: fix-or-block
  evidence_required: [command_output, device_video, diff_summary]
  cleanliness:
    debug_output: allowed-for-state-and-errors
